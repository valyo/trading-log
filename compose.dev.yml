# Dev: code mounted, hot-reload, no rebuild. Logs in terminal.
# Run:  docker compose -f compose.dev.yml up --build -d
# Edit code locally; changes apply in the browser. DB in ./data (bind mount).
# node_modules: installed inside the container (volume app-node-modules); see README → Docker.

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next:/app/.next
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  app-node-modules:
  app-next:
