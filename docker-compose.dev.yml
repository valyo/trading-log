# Interactive dev: code on host is mounted; Next.js dev server hot-reloads. No image rebuild needed.
# Run: docker compose -f docker-compose.dev.yml up --build
# Then edit code locally; changes apply in the container.

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      # Mount app code so edits on host are visible in the container
      - .:/app
      # Keep container's node_modules (don't overwrite with host)
      - app-node-modules:/app/node_modules
      # Persist SQLite DB between restarts
      - app-data:/app/data
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  app-node-modules:
  app-data:
